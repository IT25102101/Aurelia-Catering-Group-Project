spring.application.name=catering-system-backend-basic
server.port=8080

# ---- Database connection (all optional) ----
# Configured for direct TCP 1433 connection to avoid 15-30s UDP SQL Server Browser delay.
# Fallback to localhost\SQLEXPRESS is handled automatically if 1433 is unavailable.
aurelia.db.url=jdbc:sqlserver://localhost:1433;databaseName=AureliaCatering2;encrypt=true;trustServerCertificate=true;
aurelia.db.user=
aurelia.db.password=

# ---- CORS ----
# Browser origins allowed to call /api. Default: any localhost / 127.0.0.1 port.
# aurelia.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
