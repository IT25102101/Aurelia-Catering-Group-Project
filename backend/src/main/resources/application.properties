spring.application.name=catering-system-backend-basic
server.port=8080

# ---- Database connection (all optional) ----
# Leave these empty to use Windows Authentication on localhost\SQLEXPRESS (needs mssql-jdbc_auth DLL).
# To use a SQL Server login instead (no DLL needed), run Aurelia_SqlLogin_Setup.sql and fill these in.
# They can also be given as environment variables AURELIA_DB_URL / AURELIA_DB_USER / AURELIA_DB_PASSWORD.
aurelia.db.url=
aurelia.db.user=
aurelia.db.password=

# ---- CORS ----
# Browser origins allowed to call /api. Default: any localhost / 127.0.0.1 port.
# aurelia.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
